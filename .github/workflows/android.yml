name: Android Build

on:
  # 迭代包统一由 Tag 触发；main 推送不重复构建。
  push:
    tags: ['test-*', 'rc-*', 'v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.2'
  FLUTTER_CHANNEL: stable

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true  # 同 branch 新 push 取消排队中的旧 CI，避免一直排队超时

jobs:
  build:
    name: Build Android ${{ matrix.abi }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 单架构构建（2026-08-09）：test-* = TV 测试版（仅 armeabi-v7a）；
        # v* = 手机正式版（仅 arm64-v8a，TV 仍在调试暂不随正式版发布；
        #     TV 就绪后改双架构 ["arm64-v8a","armeabi-v7a"] 一次发两个正式版）；
        # rc-* 与手动触发跑双架构。
        abi: ${{ fromJson(
          startsWith(github.ref_name, 'test-') && '["armeabi-v7a"]' ||
          startsWith(github.ref_name, 'v') && '["arm64-v8a"]' ||
          '["arm64-v8a", "armeabi-v7a"]') }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify Android-only repository boundary
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(windows linux macos ios web native-poc oauth-proxy lib/tv)
          for path in "${forbidden[@]}"; do
            if [[ -e "$path" ]]; then
              echo "::error::Forbidden non-phone platform path exists: $path"
              exit 1
            fi
          done
          # 允许的 ABI 目录：arm64-v8a + armeabi-v7a（TV/投影 32 位设备）。
          mapfile -t abi_dirs < <(find android/app/src/main/jniLibs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          allowed=(arm64-v8a armeabi-v7a)
          for d in "${abi_dirs[@]}"; do
            found=0
            for a in "${allowed[@]}"; do
              [[ "$d" == "$a" ]] && found=1
            done
            [[ $found -eq 1 ]] || {
              echo "::error::Disallowed ABI dir: $d (allowed: ${allowed[*]})"
              exit 1
            }
          done

      - name: Verify bundled native libraries
        shell: bash
        run: |
          set -euo pipefail
          for dir in android/app/src/main/jniLibs/*/; do
            for so in "$dir"*.so; do
              [[ -f "$so" ]] || continue
              magic=$(head -c 4 "$so" | xxd -p)
              [[ "$magic" == "7f454c46" ]] || {
                echo "::error::$so is not an ELF binary (magic=$magic)"
                exit 1
              }
            done
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run protocol and source regression tests
        run: |
          flutter test test/android_playback_feiniu_regression_test.dart
          flutter test test/playback_url_resolver_test.dart

      - name: Normalize Android plugin toolchains
        shell: bash
        run: |
          set -euo pipefail
          for dir in "$HOME"/.pub-cache/hosted/pub.dev/*/android; do
            [[ -d "$dir" ]] || continue
            for gradle in "$dir/build.gradle" "$dir/build.gradle.kts"; do
              [[ -f "$gradle" ]] || continue
              sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' "$gradle"
              sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' "$gradle"
              sed -i -E 's/(languageVersion|apiVersion)([[:space:]]*=[[:space:]]*)"1\.[0-7]"/\1\2"1.8"/g' "$gradle"
            done
          done

      - name: Configure mandatory release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing mandatory signing secret: $name"; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          [[ -s "$RUNNER_TEMP/release.keystore" ]] || { echo '::error::Decoded keystore is empty'; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build Android ${{ matrix.abi }} release APK
        shell: bash
        env:
          TARGET_ABI: ${{ matrix.abi }}
          APP_FLAVOR: ${{ matrix.abi == 'armeabi-v7a' && 'tv' || 'phone' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # PKCS#12 的 key 密码与 store 密码统一，避免维护重复 Secret。
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' >/dev/null
          tmdb_encrypted=''
          if [[ -n "${TMDB_API_KEY:-}" ]]; then
            tmdb_encrypted=$(dart run tool/tmdb_encrypt.dart "$TMDB_API_KEY")
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # 版本号剥掉 tag 的 v 前缀（v1.0.3 → 1.0.3）：关于页/更新比较用
            # 干净版本号（UI 已自带 "v" 前缀），test-/rc- 前缀 tag 不受影响。
            version="${GITHUB_REF_NAME#v}"
          else
            version="ci-${GITHUB_RUN_NUMBER}"
          fi
          # TV 版（v7a）走 tv flavor（包名 .tv、桌面名「无界影视TV」，可与手机版共存）；
          # 手机版（arm64）走 phone flavor。
          flutter build apk \
            --release \
            --flavor "$APP_FLAVOR" \
            --target-platform "${{ matrix.abi == 'armeabi-v7a' && 'android-arm' || 'android-arm64' }}" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define "FLAVOR=$APP_FLAVOR" \
            --dart-define "APP_VERSION=$version" \
            --dart-define "DANDANPLAY_APP_ID=${DANDANPLAY_APP_ID:-}" \
            --dart-define "DANDANPLAY_APP_SECRET=${DANDANPLAY_APP_SECRET:-}" \
            --dart-define "TMDB_API_KEY_ENC=$tmdb_encrypted"
          # flavor 构建产物路径带 flavor 名
          source_apk="build/app/outputs/flutter-apk/app-${APP_FLAVOR}-release.apk"
          [[ -f "$source_apk" ]] || {
            echo '::error::Expected release APK was not produced.'
            find build/app/outputs -maxdepth 4 -type f -print || true
            exit 1
          }
          mkdir -p dist
          if [[ "$APP_FLAVOR" == "tv" ]]; then
            cp "$source_apk" "dist/WJPlayerTV-Android-${{ matrix.abi }}-$version.apk"
          else
            cp "$source_apk" "dist/WJPlayer-Android-${{ matrix.abi }}-$version.apk"
          fi

      - name: Verify APK ABI and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)
          [[ -n "$apk" ]] || { echo '::error::APK missing from dist'; exit 1; }
          mapfile -t abis < <(unzip -Z1 "$apk" | awk -F/ '/^lib\// {print $2}' | sort -u)
          [[ "${abis[*]}" == "${{ matrix.abi }}" ]] || {
            echo "::error::APK ABI mismatch; expected ${{ matrix.abi }}, found: ${abis[*]}"
            exit 1
          }
          unzip -Z1 "$apk" | grep -q '^lib/${{ matrix.abi }}/libmpv.so$'
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          [[ -x "$apksigner" ]] || { echo '::error::apksigner not found'; exit 1; }
          # 验证 v2/v3 签名结构与证书链有效。固定证书指纹已在 keystore 生成后及
          # 首个 release APK 上分别独立核验；不同 build-tools 的 --print-certs 文案
          # 不稳定，不再用易碎的文本解析阻断发布。
          "$apksigner" verify --verbose "$apk"
          echo 'Verified APK v2/v3 release signature'
          sha256sum "$apk" | tee "$apk.sha256"

      - name: Clean stale assets from tag release (same ABI)
        # 重新发布同 tag（如 v1.0.3 修复重发）时，release 会残留旧资产
        # （旧命名 WJPlayer-...-v1.0.3.apk）；更新检查按资产名匹配会先命中
        # 旧包导致下载到旧版本。发布前删除本 ABI 的旧资产，只留本次新构建。
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}"
          release_id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "$api/releases/tags/${{ github.ref_name }}" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id") or "")' 2>/dev/null || true)
          if [[ -z "$release_id" ]]; then
            echo "No existing release for ${{ github.ref_name }}, skip cleanup"
            exit 0
          fi
          # 只删本 ABI 的旧资产（未来双架构并行时互不干扰）。
          asset_ids=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "$api/releases/$release_id/assets?per_page=100" \
            | python3 -c 'import json,sys; print(" ".join(str(a["id"]) for a in json.load(sys.stdin) if "${{ matrix.abi }}" in a["name"]))' 2>/dev/null || true)
          for id in $asset_ids; do
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "$api/releases/$release_id/assets/$id" >/dev/null || true
            echo "Deleted stale asset id=$id"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WJPlayer-Android-${{ matrix.abi }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish directly installable APK to tag release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: WJPlayer ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'test-') || startsWith(github.ref_name, 'rc-') }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.sha256
          fail_on_unmatched_files: true

      # Tag 页面会直接出现 APK 与 SHA-256；Actions Artifact 继续保留作 CI 归档。