name: Android ARM64

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.2'
  FLUTTER_CHANNEL: stable

concurrency:
  group: android-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android arm64-v8a APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify Android-only repository boundary
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(windows linux macos ios web native-poc oauth-proxy android/app/src/tv lib/tv)
          for path in "${forbidden[@]}"; do
            if [[ -e "$path" ]]; then
              echo "::error::Forbidden non-phone platform path exists: $path"
              exit 1
            fi
          done
          mapfile -t abi_dirs < <(find android/app/src/main/jniLibs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          [[ "${abi_dirs[*]}" == "arm64-v8a" ]] || {
            echo "::error::Only arm64-v8a is allowed; found: ${abi_dirs[*]}"
            exit 1
          }

      - name: Verify bundled native libraries
        shell: bash
        run: |
          set -euo pipefail
          for so in android/app/src/main/jniLibs/arm64-v8a/*.so; do
            magic=$(head -c 4 "$so" | xxd -p)
            [[ "$magic" == "7f454c46" ]] || {
              echo "::error::$so is not an ELF binary (magic=$magic)"
              exit 1
            }
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run protocol and source regression tests
        run: |
          flutter test test/android_playback_feiniu_regression_test.dart
          flutter test test/playback_url_resolver_test.dart

      - name: Normalize Android plugin toolchains
        shell: bash
        run: |
          set -euo pipefail
          for dir in "$HOME"/.pub-cache/hosted/pub.dev/*/android; do
            [[ -d "$dir" ]] || continue
            for gradle in "$dir/build.gradle" "$dir/build.gradle.kts"; do
              [[ -f "$gradle" ]] || continue
              sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' "$gradle"
              sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' "$gradle"
              sed -i -E 's/(languageVersion|apiVersion)([[:space:]]*=[[:space:]]*)"1\.[0-7]"/\1\2"1.8"/g' "$gradle"
            done
          done

      - name: Configure optional release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Release keystore is not configured; Gradle will use a debug signature."
          fi

      - name: Build Android arm64-v8a release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' >/dev/null
          tmdb_encrypted=''
          if [[ -n "${TMDB_API_KEY:-}" ]]; then
            tmdb_encrypted=$(dart run tool/tmdb_encrypt.dart "$TMDB_API_KEY")
          fi
          version="1.0.0-build${GITHUB_RUN_NUMBER}"
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define "APP_VERSION=$version" \
            --dart-define "DANDANPLAY_APP_ID=${DANDANPLAY_APP_ID:-}" \
            --dart-define "DANDANPLAY_APP_SECRET=${DANDANPLAY_APP_SECRET:-}" \
            --dart-define "TMDB_API_KEY_ENC=$tmdb_encrypted"
          source_apk='build/app/outputs/flutter-apk/app-release.apk'
          [[ -f "$source_apk" ]] || {
            echo '::error::Expected release APK was not produced.'
            find build/app/outputs -maxdepth 4 -type f -print || true
            exit 1
          }
          mkdir -p dist
          cp "$source_apk" "dist/WJPlayer-Android-arm64-v8a-$version.apk"

      - name: Verify APK contains only arm64-v8a
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)
          [[ -n "$apk" ]] || { echo '::error::APK missing from dist'; exit 1; }
          mapfile -t abis < <(unzip -Z1 "$apk" | awk -F/ '/^lib\// {print $2}' | sort -u)
          [[ "${abis[*]}" == "arm64-v8a" ]] || {
            echo "::error::APK must contain only arm64-v8a; found: ${abis[*]}"
            exit 1
          }
          unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/libmpv.so$'
          sha256sum "$apk" | tee "$apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WJPlayer-Android-arm64-v8a
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
